{% set name = "astrocats" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 19584117e841c79f682218978325ddba5cce482bccbc85d2dbf377a72fae5a01

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - astrocats = astrocats.main:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - astropy-base >=7.1
    - beautifulsoup4 >=4.13
    - bokeh >=3.7
    - gitpython >=3.1.45
    - inflect >=7.5
    - matplotlib-base >=3.10
    - numpy >=2.3
    - palettable >=3.3
    - psutil >=7.0
    - requests >=2.32
    - seaborn >=0.13
    - tqdm >=4.67

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - astrocats
  commands:
    - pip check

about:
  home: https://github.com/astrocatalogs/astrocats
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Open astronomy catalogs
  description: |
    astrocats enables astronomers to construct their own curated catalogs
    of astronomical data with the intention of producing shareable catalogs
    of that data in human-readable formats
  doc_url: https://github.com/astrocatalogs/astrocats
  dev_url: https://github.com/astrocatalogs/astrocats

extra:
  recipe-maintainers:
    - guillochon
    - lzkelley
    - pkgw
